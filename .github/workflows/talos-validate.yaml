---
name: "Talos Validate"

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-job:
    name: Talos Validate Pre-Job
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: talos/**

  validate:
    name: Talos Validate
    needs: pre-job
    runs-on: ubuntu-latest
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: github:postfinance/topf aqua:siderolabs/talos aqua:mikefarah/yq aqua:getsops/sops

      - name: Render and validate Talos configs
        run: |
          set -euo pipefail
          umask 077
          mkdir -p talos/clusterconfig/ci
          trap 'rm -f talos/clusterconfig/ci/topf.yaml talos/clusterconfig/ci/secrets.yaml talos/clusterconfig/ci/output/nuc{1,2,3}.yaml; rmdir talos/clusterconfig/ci/output talos/clusterconfig/ci' EXIT
          # Use disposable secrets, never the cluster's encrypted bundle.
          yq '.secretsPath = "secrets.yaml" | .patchesDir = "../../"' \
            talos/topf.yaml > talos/clusterconfig/ci/topf.yaml
          topf secrets --topfconfig talos/clusterconfig/ci/topf.yaml --confirm=false > /dev/null
          topf render --topfconfig talos/clusterconfig/ci/topf.yaml \
            --output talos/clusterconfig/ci/output
          for f in talos/clusterconfig/ci/output/nuc{1,2,3}.yaml; do
            echo "Validating $f"
            talosctl validate --mode metal --config "$f"
          done

  talos-validate-status:
    name: Talos Validate Success
    needs: [ "validate" ]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
