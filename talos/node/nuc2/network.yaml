apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: nuc2
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("88:ae:dd:0c:fb:79", mac(link.hardware_addr))
