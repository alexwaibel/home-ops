apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 1500
addresses:
  - address: 192.168.20.22/24
routes:
  - gateway: 192.168.20.1
---
apiVersion: v1alpha1
kind: VLANConfig
name: ethSel0.7
vlanID: 7
parent: ethSel0
mtu: 1500
---
apiVersion: v1alpha1
kind: VLANConfig
name: ethSel0.30
vlanID: 30
parent: ethSel0
mtu: 1500
