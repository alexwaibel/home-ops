[settings]
experimental = true
lockfile = true

[hooks]
postinstall = '''
if [ "$MISE_INSTALLED_TOOLS" != "[]" ]; then
  mise generate git-pre-commit --write
fi
'''

[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

[tools]
"python" = "3.14.7"
"uv" = "0.12.7"
"pipx" = "1.16.7"
"pipx:makejinja" = "2.8.2"
"aqua:budimanjojo/talhelper" = "3.1.16"
"aqua:cilium/cilium-cli" = "0.19.7"
"aqua:cli/cli" = "2.97.0"
"aqua:cloudflare/cloudflared" = "2026.8.2"
"aqua:cue-lang/cue" = "0.17.1"
"aqua:FiloSottile/age" = "1.3.1"
"aqua:fluxcd/flux2" = "2.9.4"
"aqua:getsops/sops" = "3.13.3"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:go-task/task" = "3.53.1"
"aqua:helm/helm" = "4.2.4"
"aqua:helmfile/helmfile" = "1.7.4"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.7.1"
"aqua:kubernetes/kubernetes/kubectl" = "1.36.3"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:siderolabs/talos" = "1.13.8"
"aqua:yannh/kubeconform" = "0.8.0"

[tasks.pre-commit]
description = "Scan staged changes for secrets"
run = "gitleaks git --pre-commit --redact --staged --verbose"
