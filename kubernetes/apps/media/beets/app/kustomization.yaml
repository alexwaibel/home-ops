---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./pvc.yaml
configMapGenerator:
  - name: beets-config
    files:
      - config.yaml=./resources/config.yaml
      - enrich.py=./resources/enrich.py
generatorOptions:
  disableNameSuffixHash: true
