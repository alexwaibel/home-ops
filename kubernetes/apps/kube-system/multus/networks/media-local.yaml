apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: media-local
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "media-local",
      "plugins": [
        {
          "type": "macvlan",
          "master": "ethSel0.7",
          "mode": "bridge",
          "ipam": {
            "type": "static"
          }
        }
      ]
    }
