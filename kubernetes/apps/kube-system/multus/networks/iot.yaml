---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot
spec:
  # IoT VLAN is 192.168.3.0/24 (VLAN ID 3). "ethSel0" is Talos' synthetic
  # name for each node's sole device-selector interface (see
  # talos/talconfig.yaml); the VLAN sub-interface it creates is named
  # "<parent>.<vlanId>", i.e. "ethSel0.3".
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "iot",
      "plugins": [
        {
          "type": "macvlan",
          "master": "ethSel0.3",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "routes": [
              {"dst": "0.0.0.0/0", "gw": "192.168.3.1"}
            ]
          }
        },
        {
          "type": "sbr"
        }
      ]
    }
