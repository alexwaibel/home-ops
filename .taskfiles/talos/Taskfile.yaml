---
version: "3"

tasks:
  generate-config:
    desc: Generate Talos configuration
    dir: "{{.TALOS_DIR}}"
    cmds:
      - topf render --output clusterconfig
      - topf talosconfig > clusterconfig/talosconfig && chmod 600 clusterconfig/talosconfig
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOS_DIR}}/talsecret.sops.yaml
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf sops

  diff:
    desc: Preview Talos config changes on all nodes
    dir: "{{.TALOS_DIR}}"
    cmd: topf apply --dry-run
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOS_DIR}}/talsecret.sops.yaml
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf sops

  apply-node:
    desc: Apply Talos config to a node [IP=required]
    dir: "{{.TALOS_DIR}}"
    cmd: topf apply --nodes-filter '^{{.HOST}}$' --mode={{.MODE}} {{if eq (.DRY_RUN | default "false") "true"}}--dry-run{{end}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
      HOST:
        sh: yq -e '.nodes[] | select(.ip == "{{.IP}}") | .host' {{.TALOS_DIR}}/topf.yaml
    requires:
      vars: [IP]
    preconditions:
      - talosctl --nodes {{.IP}} get machineconfig
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which topf sops talosctl yq

  upgrade-node:
    desc: Upgrade Talos on a single node [IP=required]
    dir: "{{.TALOS_DIR}}"
    cmd: topf upgrade --nodes-filter '^{{.HOST}}$' --drain-timeout=10m {{if eq (.DRY_RUN | default "false") "true"}}--dry-run{{end}}
    vars:
      HOST:
        sh: yq -e '.nodes[] | select(.ip == "{{.IP}}") | .host' {{.TALOS_DIR}}/topf.yaml
    requires:
      vars: [IP]
    preconditions:
      - talosctl --nodes {{.IP}} get machineconfig
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which topf sops talosctl yq

  upgrade-k8s:
    desc: Upgrade Kubernetes
    dir: "{{.TALOS_DIR}}"
    cmd: talosctl --nodes {{.CONTROL_PLANE_IP}} upgrade-k8s --to '{{.KUBERNETES_VERSION}}'
    vars:
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TALOS_DIR}}/topf.yaml
      CONTROL_PLANE_IP:
        sh: yq -e '[.nodes[] | select(.role == "control-plane")][0].ip' {{.TALOS_DIR}}/topf.yaml
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talosctl yq

  reset:
    desc: Resets nodes back to maintenance mode
    dir: "{{.TALOS_DIR}}"
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: topf reset --full={{.CLI_FORCE}} --graceful=false --wait-for-maintenance=false
    preconditions:
      - which topf sops
